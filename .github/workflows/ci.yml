name: Local regression fixture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - run: python3 scripts/fetch-fixtures.py
      - run: npm run check
      - run: npm run report
      - name: Verify deterministic observed report
        run: git diff --exit-code -- report.json
      - name: Prepare official pinned Agave locally
        run: bash scripts/prepare-agave.sh
      - name: Run all eight scenarios on fresh Agave ledgers
        run: npm run agave
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observed-runtime-reports
          path: |
            report.json
            agave-report.json
          if-no-files-found: error
